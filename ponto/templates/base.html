<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ponto{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('kiosk.index') }}">
      {% if has_logo %}<img src="{{ url_for('static', filename='logo.png') }}" alt="">{% endif %}
      Ponto
    </a>
    <nav>
      {% if session.admin %}
        <a href="{{ url_for('admin.employees') }}">Funcionários</a>
        <a href="{{ url_for('admin.summary') }}">Relatório</a>
        <a href="{{ url_for('admin.holidays') }}">Feriados</a>
        <form method="post" action="{{ url_for('admin.logout') }}" class="inline">
          <button class="link">Sair</button>
        </form>
      {% else %}
        <a href="{{ url_for('admin.login') }}">Administração</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
